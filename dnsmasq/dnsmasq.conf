# rootless on rootless on rootless on...
user=dnsmasq
group=dnsmasq

# redirect logs to stderr to ensure we don't try to use /dev/log
log-facility=-

# DNS hosts
address=/pve.local/192.168.1.2
address=/podman.local/192.168.1.3

# DHCP config
dhcp-range=192.168.1.50,192.168.1.99,2h
dhcp-option=option:router,192.168.1.1
dhcp-option=option:dns-server,192.168.1.3

# dnsmasq cannot inject the MAC into the ARP table because we are rootless
# respond to DHCPDISCOVER via broadcast instead
dhcp-broadcast

# DHCP static lease allocations
# dhcp-host=12:34:56:78:9a,192.168.1.7

# set the domain
domain=local

# Cloudflare upstream DNS
server=1.0.0.1
server=1.1.1.1
